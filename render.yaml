services:
  - type: web
    name: a2a-invoice-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: A2A_BEARER_TOKENS
        sync: false
      - key: A2A_BASE_URL
        sync: false
      - key: DB_PATH
        value: /var/data/agent.db
    disk:
      name: invoice-agent-data
      mountPath: /var/data
      sizeGB: 1
